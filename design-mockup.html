<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudbar Android</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a15; color: #f0f0f8; }

.phone { width: 360px; height: 720px; margin: 20px auto; background: #05060a; border-radius: 40px; border: 8px solid #222; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative; }
.phone::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 25px; background: #000; border-radius: 0 0 30px 30px; z-index: 20; }

.stars { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.screen { width: 100%; height: 100%; display: flex; flex-direction: column; background: linear-gradient(135deg, #0a0a15 0%, #05060f 100%); position: relative; z-index: 2; }

.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
.header-left { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 20px; font-size: 13px; }
.header-right { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa 0%, #f26b21 100%); display: flex; align-items: center; justify-content: center; font-size: 18px; }

.content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; }

.info-chip { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(167,139,250,0.2); border-radius: 20px; padding: 8px 16px; font-size: 12px; margin-bottom: 40px; color: #9a9db3; }

.cloud { width: 120px; height: 100px; margin: 30px auto; opacity: 1; filter: drop-shadow(0 20px 40px rgba(167, 139, 250, 0.2)); }

.hero-title { font-size: 26px; font-weight: 600; margin: 40px 0 8px; line-height: 1.3; }
.hero-title .name { background: linear-gradient(135deg, #a78bfa 0%, #f26b21 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 14px; color: #6c6e82; margin-bottom: 30px; }

.controls { display: flex; gap: 10px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
.control-btn { padding: 8px 16px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #f0f0f8; font-size: 12px; cursor: pointer; transition: all 0.3s; }
.control-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(167,139,250,0.3); }
.control-btn.primary { background: linear-gradient(135deg, #a78bfa 0%, #f26b21 100%); border: none; font-weight: 500; }
.control-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(167,139,250,0.3); }

.input-section { width: 100%; padding: 20px; }
.input-box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(167, 139, 250, 0.2); border-radius: 24px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; transition: all 0.3s; margin-bottom: 16px; }
.input-box:focus-within { background: rgba(255, 255, 255, 0.12); border-color: rgba(167, 139, 250, 0.4); }
.input-box input { flex: 1; background: none; border: none; color: #f0f0f8; font-size: 13px; outline: none; }
.input-box input::placeholder { color: #6c6e82; }
.input-icons { display: flex; gap: 8px; }
.input-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #a78bfa; font-size: 14px; }

.bottom-actions { display: flex; justify-content: center; gap: 20px; padding: 0; }
.action-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: #9a9db3; font-size: 14px; transition: all 0.3s; }
.action-icon:hover { background: rgba(255,255,255,0.12); color: #a78bfa; }
</style>
</head>
<body>

<div class="phone">
  <div class="stars" id="starsContainer"></div>

  <div class="screen">
    <div class="header">
      <div class="header-left">📱 Pantalla completa</div>
      <div class="header-right">👤</div>
    </div>

    <div class="content">
      <div class="info-chip">📍 26° · Kissimmee · Nublado</div>

      <svg class="cloud" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8e8f0;stop-opacity:1" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <ellipse cx="60" cy="55" rx="50" ry="40" fill="url(#cloudGrad)" filter="url(#glow)"/>
        <circle cx="48" cy="50" r="4" fill="#0a0a15"/>
        <circle cx="72" cy="50" r="4" fill="#0a0a15"/>
        <path d="M 45 62 Q 60 68 75 62" stroke="#0a0a15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 25 60 Q 20 68 25 78" stroke="#e8e8f0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M 95 60 Q 100 68 95 78" stroke="#e8e8f0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>

      <div class="hero-title">¿Qué tarea hago por ti, <span class="name">ANGEL</span>?</div>
      <div class="hero-sub">¡Esai ¿Cómo estás?</div>

      <div class="controls">
        <div class="control-btn">Auto</div>
        <div class="control-btn">🤖 Agente</div>
        <div class="control-btn">🕐</div>
        <div class="control-btn">✏️</div>
        <div class="control-btn primary">🎙️ Bar Live</div>
      </div>
    </div>

    <div class="input-section">
      <div class="input-box">
        <span style="font-size: 16px; color: #a78bfa;">+</span>
        <input type="text" placeholder="Pregunta cualquier cosa...">
        <div class="input-icons">
          <div class="input-icon">✨</div>
          <div class="input-icon">🎙️</div>
          <div class="input-icon">↑</div>
        </div>
      </div>
      
      <div class="bottom-actions">
        <div class="action-icon">🔄</div>
        <div class="action-icon">❤️</div>
        <div class="action-icon">⭕</div>
        <div class="action-icon">📋</div>
      </div>
    </div>
  </div>
</div>

<script>
for (let i = 0; i < 50; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 360 + 'px';
  star.style.top = Math.random() * 720 + 'px';
  star.style.animationDelay = Math.random() * 3 + 's';
  document.getElementById('starsContainer').appendChild(star);
}
</script>

</body>
</html>
